@if (loginPage) {
  <router-outlet />
} @else {
  <div class="app" [class.drawer-open]="sidebar.drawerOpen()">
    <aside class="sidebar" id="sidebar" aria-label="Conversations">
      <app-sidebar />
    </aside>
    @if (sidebar.drawerOpen()) {
      <div class="scrim" (click)="sidebar.drawerOpen.set(false)"></div>
    }
    <main class="main">
      @if (demo) {
        <p class="demo-banner" role="note">
          <span><strong>Demo:</strong> replies are generated nonsense and nothing is saved.</span>
          <a class="demo-banner-cta" [href]="signupUrl">Sign in for real</a>
        </p>
      } @else {
        <app-android-app-banner placement="power" />
        @if (!androidApp.holdsBannerSlot()) {
          <app-beta-banner />
        }
      }
      <router-outlet />
    </main>
  </div>

  <app-dialog-host />
}

<app-toasts />
