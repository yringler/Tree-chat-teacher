@if (loginPage) {
  <router-outlet />
} @else {
  <div class="app" [class.drawer-open]="ui.drawerOpen()">
    <aside class="sidebar" id="sidebar" aria-label="Conversations">
      <app-sidebar />
    </aside>
    @if (ui.drawerOpen()) {
      <div class="scrim" (click)="ui.drawerOpen.set(false)"></div>
    }
    <main class="main">
      @if (demo) {
        <p class="demo-banner" role="note">
          <span><strong>Demo:</strong> replies are generated nonsense and nothing is saved.</span>
          <a class="demo-banner-cta" [href]="signupUrl">Sign in for real</a>
        </p>
      }
      <router-outlet />
    </main>
  </div>

  <app-dialog-host />
}

<div class="toasts" role="status" aria-live="polite">
  @for (t of ui.toasts(); track t.id) {
    <div class="toast" [class.toast-error]="t.kind === 'error'">
      <span>{{ t.text }}</span>
      <button type="button" class="icon-btn" aria-label="Dismiss" (click)="ui.dismiss(t.id)">
        <app-icon name="x" [size]="14" />
      </button>
    </div>
  }
</div>
