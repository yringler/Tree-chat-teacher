# Runs every check on pull requests to master and on pushes to master. Merging is
# blocked by a branch rule on master that requires the "Checks" and "End-to-end"
# jobs (repository Settings → Rules), not by this file. On master (a push, or a
# manual run there), once both pass, "Deploy sandbox" and then "Deploy" apply the
# D1 migrations and deploy each Worker (deploy.yml; docs/operating.md, "Deploying
# from GitHub").
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Flutter for apps/flutter, whose build, tests and analysis run through turbo like the other
      # apps', at the version apps/flutter/.flutter-version pins.
      - id: flutter-version
        run: echo "version=$(cat apps/flutter/.flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          cache: true
      - id: install
        run: pnpm install --frozen-lockfile
      # Turbo's task cache (turbo.json). A run restores the newest one this branch or master saved,
      # so packages nothing changed skip their tests, typechecks and builds.
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-checks-${{ github.sha }}
          restore-keys: turbo-checks-
      # Every check runs whatever the earlier ones did, so a formatting nit can't hide a failing
      # test; any failure still fails the job.
      - run: pnpm test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: pnpm build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: pnpm typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: pnpm lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: pnpm format:check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: pnpm knip
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Flutter for apps/flutter, whose build, tests and analysis run through turbo like the other
      # apps', at the version apps/flutter/.flutter-version pins.
      - id: flutter-version
        run: echo "version=$(cat apps/flutter/.flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          cache: true
      - run: pnpm install --frozen-lockfile
      # The apps' builds, from this job's last run or the Checks job's.
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-e2e-${{ github.sha }}
          restore-keys: |
            turbo-e2e-
            turbo-checks-
      - name: Install Chromium
        run: pnpm --filter @tangent/e2e exec playwright install --with-deps chromium
      # serve.mjs starts wrangler dev, which builds every app first.
      - run: pnpm e2e
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            apps/e2e/playwright-report/
            apps/e2e/test-results/
            apps/e2e/.state/wrangler.log
          include-hidden-files: true
          retention-days: 7

  # Every master build reaches the private sandbox first, so its migrations and deploy are
  # rehearsed on the sandbox's own database before production's job starts (and waits for its
  # reviewer).
  deploy-sandbox:
    name: Deploy sandbox
    needs: [checks, e2e]
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/deploy.yml
    with:
      environment: sandbox
      wrangler-env: sandbox
    # deploy.yml's job reads its environment's secrets; `inherit` lets it name them.
    secrets: inherit

  deploy:
    name: Deploy
    needs: [deploy-sandbox]
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
    secrets: inherit
