# Runs every check on pull requests to master and on pushes to master. Merging is
# blocked by a branch rule on master that requires the "Checks" and "End-to-end"
# jobs (repository Settings → Rules), not by this file. On master (a push, or a
# manual run there), once both pass, the "Deploy" job applies the D1 migrations
# and deploys the Worker (README, "Deploying from Git").
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @tangent/e2e exec playwright install --with-deps chromium
      # serve.mjs starts wrangler dev, which builds every app first.
      - run: pnpm e2e
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            apps/e2e/playwright-report/
            apps/e2e/test-results/
            apps/e2e/.state/wrangler.log
          include-hidden-files: true
          retention-days: 7

  deploy:
    name: Deploy
    needs: [checks, e2e]
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Holds the Cloudflare secrets; its deployment branch rule keeps them to master.
    environment: production
    # One deploy at a time; a newer one waits rather than cutting a running deploy or migration off.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Check the Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets on the production environment (README, \"Deploying from Git\")."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Runs wrangler.jsonc's build.command (the root `pnpm build`) and bundles the Worker, so a
      # broken build stops here, before any migration. No secrets in this or any build step.
      - name: Build
        run: pnpm --filter @tangent/worker exec wrangler deploy --dry-run
      # If wrangler ever skipped build.command, apps/worker/site would hold only .gitkeep, and that
      # Worker would 404 every app page and asset.
      - name: Check the assets
        run: |
          for app in . learn canvas admin; do
            if [ ! -s "apps/worker/site/$app/index.html" ]; then
              echo "::error::apps/worker/site/$app/index.html is missing: the apps weren't built."
              exit 1
            fi
          done
      # wrangler.jsonc without build.command, so the steps holding the token run no build: the
      # deploy uploads the site checked above.
      - name: Write the deploy config
        run: node scripts/deploy-config.mjs
      # Before the deploy, so new code never meets an old schema. Until the deploy finishes, the
      # running code meets the new schema: migrations expand first and contract in a later release.
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @tangent/worker exec wrangler d1 migrations apply DB --remote --config wrangler.deploy.json
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @tangent/worker exec wrangler deploy --config wrangler.deploy.json
