# Runs every check on pull requests to master and on pushes to master. Merging is
# blocked by a branch rule on master that requires the "Checks" and "End-to-end"
# jobs (repository Settings → Rules), not by this file. Deploys stay on Workers
# Builds, which only builds (README, "Deploying from Git").
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @tangent/e2e exec playwright install --with-deps chromium
      # serve.mjs starts wrangler dev, which builds every app first.
      - run: pnpm e2e
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            apps/e2e/playwright-report/
            apps/e2e/test-results/
            apps/e2e/.state/wrangler.log
          include-hidden-files: true
          retention-days: 7
