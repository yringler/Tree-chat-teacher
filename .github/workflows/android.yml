# Builds the Flutter app (apps/flutter) for Android and, when a track is chosen, publishes it to
# Google Play. It runs only when someone presses "Run workflow" on the Actions tab. The builds are
# this run's artifacts either way. The upload key comes from the ANDROID_KEYSTORE_* repository
# secrets; without them a build is signed with a throwaway debug key, which installs on a test
# device but can't go to Google Play. Publishing signs in to Google Play through the google-play
# environment's variables (apps/flutter/README.md, "Android").
name: Android build

on:
  workflow_dispatch:
    inputs:
      format:
        description: apk installs directly on a device; appbundle (.aab) is what Google Play takes.
        type: choice
        options: [apk, appbundle, both]
        default: apk
      track:
        description: The Google Play track to publish the app bundle to (alpha is closed testing, beta open testing); none only builds.
        type: choice
        options: [none, internal, alpha, beta, production]
        default: none
      status:
        description: The Google Play release's status; draft until the app's first release is out in Play Console.
        type: choice
        options: [completed, draft]
        default: completed
      base-url:
        description: The Tangent deployment the app talks to.
        type: string
        default: https://tangentailearning.com

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/flutter
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Publishing takes the app bundle, so a publishing run builds one whatever the format says.
      - id: formats
        env:
          FORMAT: ${{ inputs.format }}
          TRACK: ${{ inputs.track }}
        run: |
          apk=false
          aab=false
          case "$FORMAT" in
            apk) apk=true ;;
            appbundle) aab=true ;;
            both) apk=true; aab=true ;;
          esac
          if [ "$TRACK" != none ]; then aab=true; fi
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          echo "aab=$aab" >> "$GITHUB_OUTPUT"
      # The runner image has the Android SDK; its default Java changes with the image, so the JDK is
      # the one the Android Gradle Plugin is built for.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            apps/flutter/android/**/*.gradle*
            apps/flutter/android/**/gradle-wrapper.properties
      # flutter-action reads a version only from pubspec.yaml or an FVM file, so the step reads the
      # one apps/flutter/.flutter-version pins.
      - id: flutter-version
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          cache: true
          pub-cache: true
      # app/build.gradle.kts signs with android/key.properties when it exists. The secrets reach
      # the script through the environment, never through its text.
      - name: Write the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TRACK: ${{ inputs.track }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "$TRACK" != none ]; then
              echo "::error::Publishing needs the upload key: set the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS secrets."
              exit 1
            fi
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret, so this build is signed with a debug key: fine for a test device, not for Google Play."
            exit 0
          fi
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is set, so ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS must be too."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          # A PKCS12 keystore, keytool's default, has one password for the store and its key.
          {
            echo "storeFile=$RUNNER_TEMP/upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
          } > android/key.properties
      # The run number is the version code, which Google Play and an installed copy need to grow
      # with every build.
      - name: Build the APK
        if: steps.formats.outputs.apk == 'true'
        env:
          BASE_URL: ${{ inputs.base-url }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          flutter build apk --release --build-number="$BUILD_NUMBER" --dart-define=TANGENT_BASE_URL="$BASE_URL"
          mkdir -p "$RUNNER_TEMP/out"
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/out/tangent-$BUILD_NUMBER.apk"
      - name: Build the app bundle
        if: steps.formats.outputs.aab == 'true'
        env:
          BASE_URL: ${{ inputs.base-url }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          flutter build appbundle --release --build-number="$BUILD_NUMBER" --dart-define=TANGENT_BASE_URL="$BASE_URL"
          mkdir -p "$RUNNER_TEMP/out"
          cp build/app/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/out/tangent-$BUILD_NUMBER.aab"
      # Unzipped, so each artifact downloads as the .apk or .aab itself, named after the file.
      - if: steps.formats.outputs.apk == 'true'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/out/tangent-${{ github.run_number }}.apk
          archive: false
          if-no-files-found: error
          retention-days: 14
      - if: steps.formats.outputs.aab == 'true'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/out/tangent-${{ github.run_number }}.aab
          archive: false
          if-no-files-found: error
          retention-days: 14

  # Its own job so that only it can sign in to Google Play, and only after the google-play
  # environment's protection rules (a required reviewer, if one is set) let it start.
  publish:
    name: Publish to Google Play
    needs: [build]
    if: inputs.track != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: google-play
    # One upload at a time: Google Play rejects an edit when another one is open.
    concurrency:
      group: google-play
      cancel-in-progress: false
    permissions:
      contents: read
      # The OIDC token that Workload Identity Federation trades for the service account's.
      id-token: write
    steps:
      - name: Check the Google Play settings
        env:
          WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GOOGLE_PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.GOOGLE_PLAY_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$WORKLOAD_IDENTITY_PROVIDER" ] || [ -z "$SERVICE_ACCOUNT" ]; then
            echo "::error::Set the GOOGLE_PLAY_WORKLOAD_IDENTITY_PROVIDER and GOOGLE_PLAY_SERVICE_ACCOUNT variables on the google-play environment."
            exit 1
          fi
      # Only the release notes; the build job built the app.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: apps/flutter/android/whatsnew
      # Google Play rejects notes over 500 characters, after the bundle has uploaded. Empty files
      # mean the release goes out without notes.
      - id: notes
        name: Check the release notes
        run: |
          dir=apps/flutter/android/whatsnew
          for file in "$dir"/whatsnew-*; do
            length=$(LC_ALL=C.UTF-8 wc -m < "$file")
            if [ "$length" -gt 500 ]; then
              echo "::error file=$file::$length characters; Google Play takes at most 500."
              exit 1
            fi
          done
          if grep -q '[^[:space:]]' "$dir"/whatsnew-*; then
            echo "dir=$dir" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The release notes are empty, so this release has none."
          fi
      - uses: actions/download-artifact@v8
        with:
          name: tangent-${{ github.run_number }}.aab
          path: dist
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GOOGLE_PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          # The credentials file is for the upload; the access token is for reading the track back.
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
      - uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ steps.auth.outputs.credentials_file_path }}
          # android/app/build.gradle.kts's applicationId.
          packageName: com.tangentailearning.tangent
          releaseFiles: dist/**/*.aab
          track: ${{ inputs.track }}
          status: ${{ inputs.status }}
          # One whatsnew-<language> file per store listing language, such as whatsnew-en-US.
          whatsNewDirectory: ${{ steps.notes.outputs.dir }}
      # The notes describe the changes since the last release, so they start empty after one.
      - if: steps.notes.outputs.dir != ''
        run: echo "::notice file=apps/flutter/android/whatsnew/whatsnew-en-US::These release notes are on Google Play now. Empty the whatsnew files on master so the next release's notes start fresh."
      # A committed edit only means Google accepted it: a production release waits on Google's
      # review before it goes live, and Play Console's release history shows only live releases. So
      # the run reads the track back and shows what's on it in its summary. Reading needs an edit
      # of its own, which is deleted unchanged.
      - name: Show the track
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
          PACKAGE: com.tangentailearning.tangent
          TRACK: ${{ inputs.track }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          api="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PACKAGE/edits"
          call() { curl -fsS -H "Authorization: Bearer $TOKEN" "$@"; }
          edit=$(call -X POST "$api" | jq -r .id)
          releases=$(call "$api/$edit/tracks/$TRACK" | jq '.releases // []')
          call -X DELETE "$api/$edit" > /dev/null
          {
            echo "### Google Play $TRACK track"
            echo
            echo "| Release | Version codes | Status | Rollout |"
            echo "| --- | --- | --- | --- |"
            echo "$releases" | jq -r '.[] | "| \(.name // "") | \(.versionCodes // [] | join(", ")) | \(.status) | \(if .userFraction then "\(.userFraction * 100)%" else "" end) |"'
            echo
            echo "A production release is reviewed by Google before it goes live; Play Console's Publishing overview shows the review."
          } >> "$GITHUB_STEP_SUMMARY"
          if ! echo "$releases" | jq -e --arg v "$VERSION_CODE" 'any(.[]; (.versionCodes // []) | index($v))' > /dev/null; then
            echo "::error::Version code $VERSION_CODE isn't on the $TRACK track."
            exit 1
          fi
