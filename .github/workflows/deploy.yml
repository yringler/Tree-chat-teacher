# Deploys one Tangent deployment: the Worker from wrangler.jsonc's top level, or one of its `env`s.
# Called by ci.yml on master, once for the sandbox and then for production
# (docs/operating.md, "Deploying from GitHub").
name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: The GitHub environment that holds this deployment's Cloudflare secrets.
        required: true
        type: string
      wrangler-env:
        description: The wrangler.jsonc `env` to deploy; empty for the top level.
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Holds the Cloudflare secrets; its deployment branch rule keeps them to master.
    environment: ${{ inputs.environment }}
    # One deploy at a time; a newer one waits rather than cutting a running deploy or migration off.
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      # `--env <name>`, or nothing for the top level. Passed unquoted to wrangler below.
      WRANGLER_ENV_ARGS: ${{ inputs.wrangler-env != '' && format('--env {0}', inputs.wrangler-env) || '' }}
    steps:
      - name: Check the Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets on the $ENVIRONMENT environment (docs/operating.md, \"Deploying from GitHub\")."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Flutter for apps/flutter's web build, at the version apps/flutter/.flutter-version pins.
      - id: flutter-version
        run: echo "version=$(cat apps/flutter/.flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          cache: true
      - run: pnpm install --frozen-lockfile
      # Runs wrangler.jsonc's build.command (the root `pnpm build`) and bundles the Worker, so a
      # broken build stops here, before any migration. No secrets in this or any build step. This
      # job restores no turbo cache, so what deploys is always built from source.
      - name: Build
        run: pnpm --filter @tangent/worker exec wrangler deploy --dry-run $WRANGLER_ENV_ARGS
      # If wrangler ever skipped build.command, apps/worker/site would hold only .gitkeep, and that
      # Worker would 404 every app page and asset.
      - name: Check the assets
        run: |
          for app in . learn canvas admin app; do
            if [ ! -s "apps/worker/site/$app/index.html" ]; then
              echo "::error::apps/worker/site/$app/index.html is missing: the apps weren't built."
              exit 1
            fi
          done
      # wrangler.jsonc without build.command, so the steps holding the token run no build: the
      # deploy uploads the site checked above.
      - name: Write the deploy config
        run: node scripts/deploy-config.mjs
      # Before the deploy, so new code never meets an old schema. Until the deploy finishes, the
      # running code meets the new schema: migrations expand first and contract in a later release.
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @tangent/worker exec wrangler d1 migrations apply DB --remote --config wrangler.deploy.json $WRANGLER_ENV_ARGS
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @tangent/worker exec wrangler deploy --config wrangler.deploy.json $WRANGLER_ENV_ARGS
